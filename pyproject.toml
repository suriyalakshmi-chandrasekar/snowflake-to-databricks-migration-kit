[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf2dbx"
version = "0.1.0"
description = "Snowflake to Databricks SQL migration kit: translator with semantic fixes, difference register, multiset parity checks, atomic publish"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suriyalakshmi Chandrasekar" }]
requires-python = ">=3.10"
dependencies = ["sqlglot>=30,<31", "pyyaml>=6"]

[project.optional-dependencies]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sf2dbx = "sf2dbx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf2dbx = ["register.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
